include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - lib/l10n/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Portfolio app, not a published package: public API docs are not required.
    public_member_api_docs: false
    # Repository contracts are single-method interfaces on purpose.
    one_member_abstracts: false
