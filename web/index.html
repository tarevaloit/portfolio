  <style>
    html, body { margin: 0; height: 100%; background: #0E0F12; }

    /* Loader shown until Flutter paints its first frame. Pure HTML/CSS so
       it appears instantly, before any JavaScript or WASM is loaded. */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background:
        linear-gradient(rgba(198, 244, 50, 0.04) 1px, transparent 1px) 0 0 / 24px 24px,
        linear-gradient(90deg, rgba(198, 244, 50, 0.04) 1px, transparent 1px) 0 0 / 24px 24px,
        #0E0F12;
      font: 500 16px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #ECEAE4;
      transition: opacity 300ms ease;
      z-index: 10;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader .logo .accent, #loader .cursor { color: #C6F432; }
    #loader .cursor { animation: blink 1.1s steps(1) infinite; }
    #loader .bar {
      width: 160px;
      height: 2px;
      overflow: hidden;
      background: #22252B;
      border-radius: 2px;
    }
    #loader .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #C6F432;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loader { transition: none; }
      #loader .cursor, #loader .bar::after { animation: none; }
      #loader .bar::after { width: 100%; opacity: 0.4; }
    }
    noscript p {
      margin: 0;
      padding: 32px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #ECEAE4;
    }
  </style>
</head>
<body>
  <div id="loader" role="progressbar" aria-label="Cargando tobias.dev" aria-busy="true">
    <div class="logo" aria-hidden="true">tobias.<span class="accent">dev</span><span class="cursor">_</span></div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <noscript><p>Este sitio necesita JavaScript. · This site needs JavaScript.</p></noscript>

  <script>
    // The engine fires this event after painting the first frame.
    window.addEventListener('flutter-first-frame', function () {
      window.__firstFrameMs = Math.round(performance.now());
      var loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('done');
      loader.setAttribute('aria-busy', 'false');
      setTimeout(function () { loader.remove(); }, 350);
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
