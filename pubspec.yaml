name: portfolio
description: "Portfolio de Tobias Arevalo en Flutter Web."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3
  visibility_detector: ^0.4.0+2
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  very_good_analysis: ^10.3.0
flutter:
  uses-material-design: true
  generate: true

  # Asset folders are not recursive: each content folder is listed. New files
  # inside them are picked up without code changes.
  assets:
    - assets/content/
    - assets/content/projects/
    - assets/content/es/
    - assets/content/es/projects/
    - assets/content/en/
    - assets/content/en/projects/
    # Real images of the projects (WebP, fixed sizes).
    - assets/projects/
    # Downloadable CV, one PDF per language.
    - assets/cv/

  shaders:
    - shaders/blueprint.frag

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
