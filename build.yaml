targets:
  $default:
    builders:
      json_serializable:
        options:
          # DTOs only read content; they are never serialized back.
          create_to_json: false
          # Readable errors (file, key) when a content JSON is wrong.
          checked: true
          # Typos in content keys fail loudly instead of being ignored.
          disallow_unrecognized_keys: true
